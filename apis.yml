name: Parabilis Medicines
description: >-
  Parabilis Medicines (formerly FogPharma) is a clinical-stage biopharmaceutical
  company headquartered in Cambridge, Massachusetts, developing a new class of
  ultra-tunable alpha-helical peptide therapeutics called Helicons to reach
  intracellular protein targets long considered undruggable. Its AI- and
  physics-based discovery platform underpins a pipeline led by zolucatetide, a
  candidate targeting the beta-catenin / TCF interaction in the Wnt signaling
  pathway across multiple cancers. Backed by more than $500M from leading life
  sciences investors and public since its June 2026 IPO (Nasdaq: PBLS), the
  company was surfaced as a portfolio company of General Catalyst and GV. It
  publishes a public marketing and investor web presence and a science/data
  tech blog, but exposes no public developer API surface.
